openapi: "3.1.0"
info:
  title: "paw_paradise_back API"
  description: "paw_paradise_back API"
  version: "1.0.0"
servers:
  - url: "https://localhost:8081"
    description: "Local server"
paths:
  /api/clientes:
    post:
      summary: "POST api/clientes"
      operationId: "createCliente"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteRequestDto"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponseDto"
  /api/clientes/{id}:
    get:
      summary: "GET api/clientes/{id}"
      operationId: "getClienteById"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponseDto"
    delete:
      summary: "DELETE api/clientes/{id}"
      operationId: "deleteCliente"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "204":
          description: "No Content"
components:
  schemas:
    ClienteRequestDto:
      type: "object"
      properties:
        ci:
          type: "string"
        name:
          type: "string"
        lastname:
          type: "string"
        email:
          type: "string"
          format: "email"
        phone:
          type: "string"
        image:
          type: "string"
        gender:
          type: "string"
        birthdate:
          type: "string"
          format: "date-time"
        type:
          type: "string"
        address:
          type: "string"
        country:
          type: "string"
        role:
          type: "string"
    ClienteResponseDto:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        createdAt:
          type: "string"
          format: "date-time"
        personId:
          type: "integer"
          format: "int32"
        clientName:
          type: "string"
        clientEmail:
          type: "string"
        personCi:
          type: "string"
