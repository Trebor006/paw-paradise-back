name: CI Java

on:
  push:
    branches: [ "master" , "feature/*" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '17' ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'adopt'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Ensure Gradle build generates JAR
        run: ./gradlew build

      - name: Verify JAR file exists
        run: |
          if [ ! -f /app/app.jar ]; then
            echo "JAR file not found!";
            exit 1;
          fi

      - name: Build Docker image
        run: docker build -t trebor006/paw-paradise-back:latest .

#      - name: Login to Docker Hub
#        uses: docker/login-action@v2
#        with:
#          username: trebor006
#          password: ${{ secrets.DOCKERHUB_TOKEN }}
#
#      - name: Push Docker image
#        uses: docker/build-push-action@v3
#        with:
#          push: true
#          tags: trebor006/paw-paradise-back:latest
      - name: Docker Login, Build, Tag and Push to GitHub Container Registry
        uses: dinushchathurya/build-tag-push-action@v1.2.1
        with:
          username: trebor006
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          context: .
          file: Dockerfile
          repoOwner: trebor006
          repository: paw-paradise-back
          tag: latest
