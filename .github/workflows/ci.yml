name: CI Java

on:
  push:
    branches: [ "master" , "hotfix/*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '17' ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'adopt'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Ensure Gradle build generates JAR
        run: ./gradlew build

      - name: Verify JAR file exists
        run: |
          if [ ! -f build/libs/paw-paradise-back-0.0.1-SNAPSHOT.jar ]; then
            echo "JAR file not found!";
            exit 1;
          fi

#      - name: Run Mutation Tests
#        run: ./gradlew pitest

      - name: Build Docker image
        run: docker build -t trebor006/paw-paradise-back:latest .

      - name: Docker Login, Build, Tag and Push to DockerHub Container Registry
        uses: dinushchathurya/build-tag-push-action@v1.2.1
        with:
          username: trebor006
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          context: .
          file: Dockerfile
          repoOwner: trebor006
          repository: paw-paradise-back
          tag: latest

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Tag image
        run:
          docker tag trebor006/paw-paradise-back:latest registry.digitalocean.com/paw-paradise/paw-paradise-back:1.0.0
      - name: Push image to DO Container Registry
        run: docker push registry.digitalocean.com/paw-paradise/paw-paradise-back:1.0.0
