name: CI Java

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        java-version: [ '17' ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'adopt'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build Docker image
        run: docker build -t trebor006/paw-paradise-back:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: trebor006
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        uses: docker/build-push-action@v3
        with:
          push: true
          tags: trebor006/paw-paradise-back:latest
